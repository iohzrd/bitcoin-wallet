[workspace]
resolver = "3"
members = ["core", "airgap", "node", "app"]
# The fuzz targets build with cargo-fuzz, in a workspace of their own.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
wallet-airgap = { path = "airgap" }
wallet-core = { path = "core" }
wallet-node = { path = "node" }

# The kept wallet's key from its passphrase, its lanes on threads of their own.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
bip39 = { version = "3", features = ["zeroize"] }
bitcoin = { version = "0.32", features = ["base64"] }
bitcoinconsensus = "0.106"
# Core draws no randomness of its own: the app passes in each nonce.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
# FIDO2 security keys over USB HID (hidraw), for sealing a kept wallet with one.
ctap-hid-fido2 = "3.6"
# No accesskit (its Linux backend talks D-Bus), no wgpu: glow's OpenGL ES is what the
# handhelds' Mali GPUs run under Mesa's Panfrost.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
getrandom = "0.4"
libc = "0.2"
gilrs = "0.11"
miniscript = "13"
# Plain HTTP to a node on this machine or the local network: no TLS stack.
minreq = "3"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
serde_json = "1"
thiserror = "2.0.21"
ur = "0.5"
zeroize = "1.9"

# Unlocking a kept wallet takes seconds of Argon2 optimized and minutes of it not.
[profile.dev.package.argon2]
opt-level = 3
