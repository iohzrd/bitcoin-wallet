# Formatting, lints and the test suite on every push and pull request. The signer's tests finalize
# what it signs and run it through Bitcoin Core's script interpreter (the bitcoinconsensus crate,
# built from C++ here), so a signature that would not be accepted on chain fails the build.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # gilrs reads gamepads through libudev.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Format
        run: cargo fmt --all --check

      # Without features: the offline signer. With all of them: the online wallet as well.
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The app's UI tests drive it by the keys the gamepad sends, with no window.
      - name: Test
        run: |
          cargo test --workspace --all-targets
          cargo test --workspace --all-targets --all-features

      # The offline build is the one that goes on a signer: no HTTP, TLS or RPC client may be in
      # it, which a dependency added to the wrong crate or a feature left on would put there.
      - name: The offline build has no network client
        run: |
          found=$(cargo tree -p wallet -e normal --prefix none | cut -d' ' -f1 | sort -u \
            | grep -xE 'wallet-node|minreq|ureq|reqwest|hyper|curl|rustls|native-tls|openssl|tokio' || true)
          if [ -n "$found" ]; then
            echo "the offline build depends on: $found"
            exit 1
          fi

  regtest:
    name: against Bitcoin Core on regtest
    runs-on: ubuntu-24.04
    env:
      CORE_VERSION: "31.1"
      # From the release's SHA256SUMS.
      CORE_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Bitcoin Core
        run: |
          file=bitcoin-$CORE_VERSION-x86_64-linux-gnu.tar.gz
          curl -sSfLO https://bitcoincore.org/bin/bitcoin-core-$CORE_VERSION/$file
          echo "$CORE_SHA256  $file" | sha256sum -c -
          tar -xzf $file
          echo "BITCOIND=$PWD/bitcoin-$CORE_VERSION/bin/bitcoind" >> "$GITHUB_ENV"

      # The ignored tests, but for the screenshots, which need a GPU.
      - name: Test
        run: cargo test --workspace --all-features -- --ignored --skip screenshots
