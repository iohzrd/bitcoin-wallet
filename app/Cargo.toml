[package]
name = "wallet"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
online = ["dep:wallet-node"]
# Sealing a kept wallet with a FIDO2 security key, over USB: off by default, as it brings a FIDO2
# library and the HID stack into the build.
security-key = ["dep:ctap-hid-fido2"]

[dependencies]
clap.workspace = true
ctap-hid-fido2 = { workspace = true, optional = true }
eframe.workspace = true
getrandom.workspace = true
gilrs.workspace = true
wallet-airgap.workspace = true
wallet-core.workspace = true
wallet-node = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
serde_json.workspace = true
wallet-node = { workspace = true, features = ["test-support"] }
